<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio Green – rezervácie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // ==== NASTAVENIE: doplňte z Supabase → Project Settings → API ====
  const SUPABASE_URL = "https://kolyhhefubusybvtynbv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_RTWF_BHyptvwrUPxQz-sBQ_rZ28j8NS";
  const NAZOV = "Studio Green";
</script>
<style>
:root{
  --bg:#eef3ee; --panel:#ffffff; --ink:#13241a; --muted:#5a6d60; --line:#d3ddd5;
  --accent:#1f8a4c; --accent-ink:#ffffff; --taken:#e1e8e2; --mine:#1d5f7a; --mine-soft:#d8eaf1; --ok:#1f8a4c; --warn:#a15c00;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1712; --panel:#17221b; --ink:#e5efe7; --muted:#92a698; --line:#2a3a2f;
  --accent:#4cc77d; --accent-ink:#06170d; --taken:#213027; --mine:#6cc3e3; --mine-soft:#173341; --ok:#4cc77d; --warn:#f0b35a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) 160px;display:grid;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 .rec{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--accent);margin-right:.25em;vertical-align:.12em}
.price{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;width:58px;padding:8px 0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;display:grid;gap:2px;text-align:center;font:inherit}
.day small{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day b{font-family:var(--f-display);font-size:1.35rem;line-height:1}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rack{display:grid;gap:4px}
.slot{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.slot .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92rem}
.slot .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.slot .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.slot.free .tag{color:var(--ok)}
.slot.taken{background:var(--taken);cursor:default}
.slot.taken .tag{color:var(--muted)}
.slot.mine{background:var(--mine-soft);border-color:var(--mine)}
.slot.mine .tag,.slot.mine .who{color:var(--mine)}
.slot.past{opacity:.45;cursor:default}
.slot.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot.sel .tag{color:var(--accent-ink)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tray-in{max-width:720px;margin:0 auto;display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sum{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.sum span{font-family:var(--f-mono);font-size:.9rem;font-weight:500;color:var(--muted);margin-left:6px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 160px}
.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:.88rem;margin:0}
.msg.err{color:var(--accent)}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;display:grid;gap:10px}
.card h2{font-family:var(--f-display);font-size:1.25rem;margin:0;text-transform:uppercase;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;margin:0}
.kv dt{color:var(--muted);font-size:.85rem}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.copy{font:inherit;font-size:.78rem;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer}
.paylink{display:inline-block;text-align:center;font-weight:600;padding:12px 16px;border-radius:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
details.admin{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px 16px}
details.admin summary{cursor:pointer;font-weight:600}
.admin .grid{display:grid;gap:10px;margin-top:12px}
.admin label{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bitem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.bitem .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted)}
.pill{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;border:1px solid currentColor;background:transparent;cursor:pointer;font-family:var(--f-body)}
.pill.paid{color:var(--ok)} .pill.unpaid{color:var(--warn)}
footer{font-size:.8rem;color:var(--muted);text-align:center}
footer button{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}
@media (max-width:440px){.slot{grid-template-columns:78px 1fr auto;gap:8px}.three{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="rec" aria-hidden="true"></span><span id="title">Studio Green</span></h1>
    <div class="price" id="priceLine"></div>
  </header>
  <p class="note" id="status">Načítavam voľné termíny…</p>
  <nav class="days" id="days" aria-label="Dni"></nav>
  <div class="rack" id="rack"></div>
  <section class="card" id="pay" hidden></section>
  <section class="card" id="mine" hidden></section>

  <details class="admin" id="admin" hidden>
    <summary>Správa skúšobne</summary>
    <div class="grid">
      <div class="three">
        <label>Cena / hod (Kč)<input type="number" id="cPrice" min="0" step="10"></label>
        <label>Otvárame<input type="number" id="cOpen" min="0" max="23"></label>
        <label>Zatvárame<input type="number" id="cClose" min="1" max="24"></label>
        <label>Max. hodín<input type="number" id="cMax" min="1" max="12"></label>
      </div>
      <label>IBAN<input type="text" id="cIban" placeholder="CZ00 0000 0000 0000 0000 0000"></label>
      <label>Príjemca platby<input type="text" id="cRecipient"></label>
      <label>Odkaz na platbu kartou (Stripe, SumUp, GoPay…)<input type="url" id="cLink" placeholder="https://"></label>
      <div class="row"><button class="btn" id="saveCfg">Uložiť nastavenia</button><button class="btn ghost" id="logout">Odhlásiť</button><p class="msg" id="cfgMsg"></p></div>
    </div>
    <div id="blist"></div>
  </details>

  <section class="card" id="login" hidden>
    <h2>Prihlásenie správcu</h2>
    <p class="note">Zadajte e-mail a heslo. Bez hesla vám pošleme odkaz na prihlásenie e-mailom.</p>
    <div class="row"><input type="email" id="loginEmail" placeholder="vas@email.sk" autocomplete="email"><input type="password" id="loginPass" placeholder="Heslo" autocomplete="current-password"><button class="btn" id="loginBtn">Prihlásiť</button></div>
    <p class="msg" id="loginMsg"></p>
  </section>

  <footer><button id="showLogin" type="button">Správa</button></footer>
</div>

<div class="tray" id="tray" hidden>
  <div class="tray-in">
    <div class="sum" id="traySum"></div>
    <div class="row">
      <input type="text" id="band" placeholder="Kapela alebo meno" maxlength="60" autocomplete="organization">
      <input type="tel" id="phone" placeholder="Telefón (vidí len majiteľ)" maxlength="30" autocomplete="tel">
    </div>
    <div class="row">
      <button class="btn accent" id="bookBtn">Rezervovať</button>
      <button class="btn ghost" id="clearBtn">Zrušiť výber</button>
    </div>
    <p class="msg" id="trayMsg"></p>
  </div>
</div>

<script>
(function(){
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const DAYS=14, DN=["Ne","Po","Ut","St","Št","Pi","So"];
let cfg={price:12,open_hour:10,close_hour:22,max_hours:4,iban:"",recipient:"",pay_link:""};
let taken={}, day=ymd(new Date()), sel=[], isAdmin=false, adminRows=[];
let mine=load("skusobna-mine",[]);
const $=id=>document.getElementById(id);
document.title=NAZOV+" – rezervácie";$("title").textContent=NAZOV;

function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function key(d,h){return d+"-"+h}
function hh(h){return String(h).padStart(2,"0")+":00"}
function vs(d,h){return d.slice(2).replace(/-/g,"")+String(h).padStart(2,"0")}
function eur(n){return (Math.round(n*100)/100).toLocaleString("cs-CZ",{maximumFractionDigits:2})+" Kč"}
function fmtDay(d){const x=new Date(d+"T12:00");return DN[x.getDay()]+" "+x.getDate()+". "+(x.getMonth()+1)+"."}
function setStatus(t){$("status").textContent=t||("Vyberte deň a ťuknite na voľnú hodinu. Susedné hodiny pridáte ďalším ťuknutím (max "+cfg.max_hours+" h).")}
function mineAt(d,h){return mine.find(m=>m.day===d&&h>=m.start&&h<m.start+m.hours)}

async function loadAll(){
  const today=ymd(new Date());
  const [s,t]=await Promise.all([
    sb.from("settings").select("*").eq("id",1).single(),
    sb.rpc("taken_slots",{from_day:today})
  ]);
  if(s.error||t.error){setStatus("Kalendár sa nepodarilo načítať. Skúste obnoviť stránku.");return}
  cfg=s.data; taken={}; t.data.forEach(r=>taken[key(r.day,r.hour)]=1);
  mine=mine.filter(m=>m.day>=today); save("skusobna-mine",mine);
  sel=sel.filter(h=>!taken[key(day,h)]);
  if(isAdmin) await loadAdmin();
  setStatus(); render();
}

function renderDays(){
  const nav=$("days");nav.textContent="";const t=new Date();
  for(let i=0;i<DAYS;i++){
    const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i),k=ymd(d);
    const b=document.createElement("button");b.className="day";b.type="button";b.setAttribute("aria-pressed",k===day);
    const s=document.createElement("small");s.textContent=i===0?"Dnes":DN[d.getDay()];
    const n=document.createElement("b");n.textContent=d.getDate();
    b.append(s,n);b.onclick=()=>{day=k;sel=[];render()};nav.append(b);
  }
}

function render(){
  $("priceLine").textContent=eur(+cfg.price)+" / hod";
  renderDays();
  const rack=$("rack");rack.textContent="";
  const now=new Date(),today=ymd(now);
  for(let h=cfg.open_hour;h<cfg.close_hour;h++){
    const past=day<today||(day===today&&h<=now.getHours());
    const b=document.createElement("button");b.type="button";b.className="slot";
    const t=document.createElement("span");t.className="t";t.textContent=hh(h)+"–"+hh(h+1);
    const who=document.createElement("span");who.className="who";
    const tag=document.createElement("span");tag.className="tag";
    const m=mineAt(day,h);
    if(taken[key(day,h)]){
      if(m){b.classList.add("mine");who.textContent=m.band;tag.textContent="Vaše";b.onclick=()=>showMine()}
      else{b.classList.add("taken");tag.textContent="Obsadené";b.disabled=true;
        if(isAdmin){const r=adminRows.find(r=>r.day===day&&r.hour===h);if(r)who.textContent=r.band}}
    }else if(past){b.classList.add("past");tag.textContent="—";b.disabled=true}
    else{b.classList.add("free");tag.textContent=sel.includes(h)?"Vybrané":"Voľné";if(sel.includes(h))b.classList.add("sel");b.onclick=()=>toggle(h)}
    b.append(t,who,tag);rack.append(b);
  }
  renderTray();showMine();
}

function toggle(h){
  $("trayMsg").textContent="";
  if(sel.includes(h)){
    if(h===Math.min(...sel)||h===Math.max(...sel))sel=sel.filter(x=>x!==h);else sel=[h];
  }else if(sel.length&&sel.length<cfg.max_hours&&(h===Math.max(...sel)+1||h===Math.min(...sel)-1))sel.push(h);
  else sel=[h];
  sel.sort((a,b)=>a-b);render();
}

function renderTray(){
  if(!sel.length){$("tray").hidden=true;return}
  $("tray").hidden=false;
  const a=sel[0],z=sel[sel.length-1]+1,s=$("traySum");s.textContent=fmtDay(day)+" · "+hh(a)+"–"+hh(z);
  const sp=document.createElement("span");sp.textContent=sel.length+" h · "+eur(sel.length*cfg.price);s.append(sp);
}

async function book(){
  const band=$("band").value.trim(),phone=$("phone").value.trim(),m=$("trayMsg");
  m.className="msg err";
  if(!band){m.textContent="Napíšte názov kapely alebo meno.";$("band").focus();return}
  $("bookBtn").disabled=true;m.className="msg";m.textContent="Ukladám rezerváciu…";
  const start=sel[0],hours=sel.length,d=day;
  const {data,error}=await sb.rpc("book",{p_day:d,p_start:start,p_hours:hours,p_band:band,p_phone:phone});
  $("bookBtn").disabled=false;
  if(error){
    m.className="msg err";
    m.textContent=/TAKEN/.test(error.message)?"Niekto si tento termín práve rezervoval. Vyberte si iný.":("Rezerváciu sa nepodarilo uložiť: "+error.message);
    await loadAll();return;
  }
  const r=data[0];
  const b={day:d,start,hours,band,group:r.group_id,token:r.cancel_token};
  mine.push(b);save("skusobna-mine",mine);save("skusobna-band",band);
  sel=[];m.textContent="";await loadAll();showPay(b);
}

function showPay(b){
  const p=$("pay");p.hidden=false;p.textContent="";
  const h=document.createElement("h2");h.textContent="Rezervované";
  const d=document.createElement("p");d.className="note";
  d.textContent=b.band+" · "+fmtDay(b.day)+" "+hh(b.start)+"–"+hh(b.start+b.hours)+". Prosíme o úhradu vopred.";
  p.append(h,d);
  const kv=document.createElement("dl");kv.className="kv";
  const add=(k,v,c)=>{const dt=document.createElement("dt");dt.textContent=k;const dd=document.createElement("dd");dd.textContent=v;kv.append(dt,dd);
    if(c){const bt=document.createElement("button");bt.className="copy";bt.type="button";bt.textContent="Kopírovať";
      bt.onclick=()=>navigator.clipboard.writeText(v).then(()=>bt.textContent="Skopírované").catch(()=>{});kv.append(bt)}else kv.append(document.createElement("span"))};
  add("Suma",eur(b.hours*cfg.price));
  if(cfg.iban)add("IBAN",cfg.iban,true);
  if(cfg.recipient)add("Príjemca",cfg.recipient);
  add("Var. symbol",vs(b.day,b.start),true);
  p.append(kv);
  if(/^https:\/\//.test(cfg.pay_link||"")){const a=document.createElement("a");a.className="paylink";a.href=cfg.pay_link;a.target="_blank";a.rel="noopener";a.textContent="Zaplatiť kartou online";p.append(a)}
  p.scrollIntoView({behavior:"smooth",block:"start"});
}

function showMine(){
  const box=$("mine");box.textContent="";
  if(!mine.length){box.hidden=true;return}
  box.hidden=false;
  const h=document.createElement("h2");h.textContent="Moje rezervácie";box.append(h);
  mine.slice().sort((a,b)=>(a.day+a.start).localeCompare(b.day+b.start)).forEach(b=>{
    const r=document.createElement("div");r.className="bitem";
    const l=document.createElement("div");l.textContent=b.band;
    const t=document.createElement("div");t.className="t";t.textContent=fmtDay(b.day)+" "+hh(b.start)+"–"+hh(b.start+b.hours)+" · VS "+vs(b.day,b.start);l.append(t);
    const pay=document.createElement("button");pay.className="copy";pay.textContent="Platba";pay.onclick=()=>showPay(b);
    const c=document.createElement("button");c.className="copy";c.textContent="Zrušiť";
    c.onclick=async()=>{
      if(c.dataset.confirm!=="1"){c.dataset.confirm="1";c.textContent="Naozaj zrušiť?";setTimeout(()=>{c.dataset.confirm="";c.textContent="Zrušiť"},4000);return}
      const {error}=await sb.rpc("cancel_booking",{p_group:b.group,p_token:b.token});
      if(error){c.textContent="Chyba";return}
      mine=mine.filter(x=>x.group!==b.group);save("skusobna-mine",mine);$("pay").hidden=true;loadAll();
    };
    r.append(l,pay,c);box.append(r);
  });
  const n=document.createElement("p");n.className="note";n.textContent="Rezervácie si pamätá tento prehliadač. Ak ich treba zrušiť z iného zariadenia, ozvite sa majiteľovi.";box.append(n);
}

// ---------- Správa ----------
async function checkAdmin(){
  const {data:{session}}=await sb.auth.getSession();
  isAdmin=false;
  if(session){
    const {data}=await sb.rpc("is_admin");
    isAdmin=data===true;
  }
  $("admin").hidden=!isAdmin;$("login").hidden=true;
  if(session&&!isAdmin){setStatus("Tento e-mail nemá prístup k správe.");}
  if(isAdmin){fillCfg();$("admin").open=true;await loadAdmin();render()}
}
function fillCfg(){$("cPrice").value=cfg.price;$("cOpen").value=cfg.open_hour;$("cClose").value=cfg.close_hour;$("cMax").value=cfg.max_hours;$("cIban").value=cfg.iban;$("cRecipient").value=cfg.recipient;$("cLink").value=cfg.pay_link}
async function loadAdmin(){
  const {data,error}=await sb.from("bookings").select("*").gte("day",ymd(new Date())).order("day").order("hour");
  if(error)return;adminRows=data;
  const groups={};data.forEach(r=>{(groups[r.group_id]=groups[r.group_id]||[]).push(r)});
  const list=$("blist");list.textContent="";
  const head=document.createElement("p");head.className="note";head.style.marginTop="14px";
  head.textContent=Object.keys(groups).length?"Nadchádzajúce rezervácie":"Zatiaľ žiadne rezervácie.";list.append(head);
  Object.values(groups).forEach(rows=>{
    const g=rows[0],start=rows[0].hour,hours=rows.length;
    const r=document.createElement("div");r.className="bitem";
    const l=document.createElement("div");l.textContent=g.band+(g.phone?" · "+g.phone:"");
    const t=document.createElement("div");t.className="t";t.textContent=fmtDay(g.day)+" "+hh(start)+"–"+hh(start+hours)+" · VS "+vs(g.day,start)+" · "+eur(hours*cfg.price);l.append(t);
    const pill=document.createElement("button");pill.className="pill "+(g.paid?"paid":"unpaid");pill.textContent=g.paid?"Zaplatené":"Nezaplatené";
    pill.onclick=async()=>{pill.disabled=true;await sb.from("bookings").update({paid:!g.paid}).eq("group_id",g.group_id);loadAll()};
    const del=document.createElement("button");del.className="copy";del.textContent="Zrušiť";
    del.onclick=async()=>{if(del.dataset.c!=="1"){del.dataset.c="1";del.textContent="Naozaj?";return}await sb.from("bookings").delete().eq("group_id",g.group_id);loadAll()};
    r.append(l,pill,del);list.append(r);
  });
}
async function saveCfg(){
  const m=$("cfgMsg");
  const n={price:+$("cPrice").value||0,open_hour:parseInt($("cOpen").value),close_hour:parseInt($("cClose").value),max_hours:parseInt($("cMax").value)||4,
    iban:$("cIban").value.trim().toUpperCase(),recipient:$("cRecipient").value.trim(),pay_link:$("cLink").value.trim()};
  if(!(n.close_hour>n.open_hour)){m.className="msg err";m.textContent="Zatváracia hodina musí byť neskôr ako otváracia.";return}
  if(n.pay_link&&!/^https:\/\//.test(n.pay_link)){m.className="msg err";m.textContent="Odkaz na platbu musí začínať https://";return}
  const {error}=await sb.from("settings").update(n).eq("id",1);
  m.className=error?"msg err":"msg";m.textContent=error?"Nepodarilo sa uložiť: "+error.message:"Uložené.";
  if(!error)loadAll();
}

$("showLogin").onclick=async()=>{const {data:{session}}=await sb.auth.getSession();if(session&&isAdmin){$("admin").open=true;$("admin").scrollIntoView()}else{$("login").hidden=false;$("loginEmail").focus()}};
$("loginBtn").onclick=async()=>{
  const e=$("loginEmail").value.trim(),pw=$("loginPass").value,m=$("loginMsg");if(!e)return;
  if(pw){
    const {error}=await sb.auth.signInWithPassword({email:e,password:pw});
    m.className=error?"msg err":"msg";m.textContent=error?"Prihlásenie zlyhalo: nesprávny e-mail alebo heslo.":"Prihlásené.";
    if(!error){$("loginPass").value="";checkAdmin()}
    return;
  }
  const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
  m.className=error?"msg err":"msg";m.textContent=error?"Nepodarilo sa odoslať: "+error.message:"Skontrolujte e-mail a kliknite na odkaz.";
};
$("logout").onclick=async()=>{await sb.auth.signOut();isAdmin=false;$("admin").hidden=true;render()};
$("saveCfg").onclick=saveCfg;$("bookBtn").onclick=book;$("clearBtn").onclick=()=>{sel=[];render()};
$("band").value=load("skusobna-band","")||"";

sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN")checkAdmin()});
loadAll().then(checkAdmin);
setInterval(()=>{if(!document.hidden&&!sel.length)loadAll()},30000);
})();
</script>
</body>
</html>
